<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — Shui Thread</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: var(--cream); }
    .ok-wrap {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 4rem 1.5rem;
    }
    .ok-mark {
      width: 72px; height: 72px;
      border: 1.5px solid var(--orange);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 2rem;
      color: var(--orange);
    }
    .ok-title {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 6vw, 4rem);
      letter-spacing: -0.02em; line-height: 1.05;
      margin-bottom: 0.6rem;
    }
    .ok-title em { color: var(--orange); font-style: italic; }
    .ok-sub {
      font-family: var(--font-mono);
      font-size: 0.72rem; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--ink-muted);
      margin-bottom: 2.4rem;
    }
    .ok-meta {
      font-family: var(--font-mono); font-size: 0.7rem;
      letter-spacing: 0.12em; color: var(--ink-muted);
      padding: 0.6rem 1.4rem;
      border: 1px solid var(--border); border-radius: 2px;
      margin-bottom: 2.4rem;
    }
    .ok-body { max-width: 36rem; line-height: 1.8; color: var(--ink-soft); margin-bottom: 2.4rem; }
    .ok-back {
      font-family: var(--font-mono); font-size: 0.7rem;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--ink); border-bottom: 1px solid var(--orange);
      padding-bottom: 0.3rem; text-decoration: none;
    }
  </style>
</head>
<body>
<div class="ok-wrap">
  <div class="ok-mark">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 13l4 4L19 7"/></svg>
  </div>
  <h1 class="ok-title">Order<br><em>Confirmed</em></h1>
  <div class="ok-sub">订单确认 · Thank you</div>
  <div class="ok-meta" id="order-ref">ORDER · loading…</div>
  <p class="ok-body">
    A receipt has been sent to your email. Your handmade piece will be prepared in Sandu, Guizhou and shipped within 7–21 days. We'll write again as soon as it leaves the studio.
  </p>
  <a href="/" class="ok-back">Return Home ↗</a>
</div>

<script src="/js/cart.js"></script>
<script>
  Cart.clearCart();
  if (typeof updateCartBadge === 'function') updateCartBadge();
  const sid = new URLSearchParams(location.search).get('session_id');
  if (sid) {
    document.getElementById('order-ref').textContent = 'ORDER · ' + sid.slice(-12).toUpperCase();
  } else {
    document.getElementById('order-ref').style.display = 'none';
  }
</script>
</body>
</html>
