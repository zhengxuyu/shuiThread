<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>订单后台 — Shui Thread</title>
  <style>
    :root { --ink:#0D0D0D; --soft:#2A2A2A; --muted:#6B6558; --cream:#F7F3ED; --parch:#EDE7DC; --line:#E2DBCF; --orange:#D94E1F; --teal:#0A6464; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cream); color: var(--ink); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--ink); color: #fff; }
    header b { font-family: Georgia, serif; font-weight: 400; font-size: 18px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; border-radius: 3px; padding: 9px 14px; border: 1px solid var(--ink); background: var(--ink); color: #fff; }
    button.ghost { background: transparent; color: var(--ink); }
    header button { border-color: #666; background: transparent; }
    button:disabled { opacity: .5; cursor: default; }
    input, select { padding: 9px 10px; border: 1px solid #C9C1B3; border-radius: 3px; background: #fff; min-width: 0; font-size: 16px; }
    main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
    .login { max-width: 340px; margin: 12vh auto; display: grid; gap: 12px; }
    .err { color: var(--orange); font-size: 14px; min-height: 1.3em; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tabs button { background: transparent; color: var(--ink); }
    .tabs button.on { background: var(--ink); color: #fff; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 16px; margin-bottom: 14px; }
    .top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .ref { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: var(--parch); }
    .badge.todo { background: #FBE8DF; color: var(--orange); }
    .badge.done { background: #D4ECEC; color: var(--teal); }
    .items { margin: 10px 0; font-weight: 600; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; font-size: 14px; }
    .k { color: var(--muted); font-size: 12px; }
    .ship { display: grid; grid-template-columns: 140px 1fr auto; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .tracked { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 10px; font-size: 13px; }
    .row a { color: var(--teal); }
    .link { padding: 0; border: 0; background: none; color: var(--teal); text-decoration: underline; font-size: 13px; }
    .warn { color: var(--orange); font-size: 13px; margin-top: 6px; }
    .refund { margin-top: 12px; padding: 10px 12px; background: #FBE8DF; border-radius: 3px; font-size: 14px; }
    .refund b { color: var(--orange); }
    .tabs .gap { flex-basis: 12px; }
    .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
    .form .wide { grid-column: 1 / -1; }
    .form input, .form select, .form textarea { width: 100%; color: var(--ink); }
    textarea { font: inherit; font-size: 16px; padding: 9px 10px; border: 1px solid #C9C1B3; border-radius: 3px; resize: vertical; }
    h3 { margin: 0 0 12px; font-family: Georgia, serif; font-weight: 400; font-size: 20px; }
    .hint { font-size: 13px; color: var(--muted); margin: 0; }
    .ok { color: var(--teal); font-size: 14px; }
    .code { font-family: ui-monospace, Menlo, monospace; font-size: 16px; font-weight: 600; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .table-wrap { max-height: 60vh; overflow: auto; margin-bottom: 14px; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
    table { width: 100%; min-width: 820px; border-collapse: collapse; font-size: 14px; }
    th { position: sticky; top: 0; z-index: 1; padding: 10px 12px; background: var(--parch); color: var(--muted); font-size: 12px; font-weight: 500; text-align: left; white-space: nowrap; }
    td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
    tr.on td { background: #FBF7F0; }
    td.code { font-size: 14px; white-space: nowrap; }
    td.note { max-width: 180px; overflow-wrap: anywhere; color: var(--muted); }
    td.ops { white-space: nowrap; }
    td.ops .link { margin-right: 8px; }
    td .hint { font-size: 12px; overflow-wrap: anywhere; }
    .empty { color: var(--muted); padding: 40px 0; text-align: center; }
    @media (max-width: 600px) { .form, .grid, .ship { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header><b>Shui Thread · 订单后台</b><button id="logout" hidden>退出</button></header>
<main id="app"></main>
<script>
const app = document.getElementById('app'), logoutBtn = document.getElementById('logout');
const e = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const gbp = p => '£' + (p % 100 === 0 ? p / 100 : (p / 100).toFixed(2));
let orders = [], carriers = [], tab = 'todo', editing = null;
let coupons = null, couponErr = '', editingCoupon = null, sentMsg = '';
const api = async (url, body) => {
  const r = await fetch(url, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && !url.endsWith('/login')) { showLogin(); throw new Error('请先登录'); }
  if (!r.ok) throw new Error(data.error || '操作失败');
  return data;
};
function showLogin() {
  logoutBtn.hidden = true;
  app.innerHTML = '<form class="login"><h2 style="margin:0;font-family:Georgia,serif;font-weight:400">登录</h2><input type="password" placeholder="密码" autocomplete="current-password" required><button>登录</button><div class="err"></div></form>';
  const f = app.querySelector('form');
  f.onsubmit = async ev => {
    ev.preventDefault();
    f.querySelector('.err').textContent = '';
    try { await api('/api/admin/login', { password: f.querySelector('input').value }); await load(); }
    catch (err) { f.querySelector('.err').textContent = err.message; }
  };
  f.querySelector('input').focus();
}
async function load() {
  const d = await api('/api/admin/orders');
  orders = d.orders; carriers = d.carriers;
  logoutBtn.hidden = false;
  render();
}
const isDone = o => o.shipment && o.shipment.emailSent;
function shipForm(o) {
  const s = o.shipment;
  return `<form class="ship" data-id="${e(o.id)}">
    <select name="carrier">${carriers.map(c => `<option value="${e(c.id)}" ${s && s.carrier === c.id ? 'selected' : ''}>${e(c.name)}</option>`).join('')}</select>
    <input name="tracking" placeholder="快递单号" value="${e(s ? s.tracking : '')}" autocomplete="off" required>
    <button>${isDone(o) ? '更正并重发邮件' : '标记已发货并通知买家'}</button>
    <div class="err" style="grid-column:1/-1"></div>
  </form>`;
}
function refundBox(o) {
  const r = o.refund;
  if (!r) return '';
  const when = new Date(r.requestedAt).toLocaleString('zh-CN', { dateStyle: 'medium', timeStyle: 'short' });
  return `<div class="refund"><b>买家申请退款</b> · ${e(when)} · ${r.reason === 'faulty' ? '有瑕疵、损坏或与描述不符' : '无理由退货'}
    ${r.note ? `<div style="white-space:pre-wrap;margin-top:6px">${e(r.note)}</div>` : ''}
    <div style="margin-top:6px;font-size:13px">退款需要在 Stripe 手动操作${o.shipment ? '' : '；尚未发货，请不要再寄出'}。${r.emailSent ? '' : '<br>通知邮件没有发出，请直接联系买家。'}</div></div>`;
}
function card(o) {
  const a = o.address || {};
  const addr = [o.customerName, a.line1, a.line2, a.city, a.state, a.postal_code, a.country].filter(Boolean);
  const s = o.shipment;
  const done = isDone(o);
  const when = new Date(o.createdAt * 1000).toLocaleString('zh-CN', { dateStyle: 'medium', timeStyle: 'short' });
  return `<div class="card">
    <div class="top"><div><span class="ref">${e(o.ref)}</span> · ${e(when)}</div>
      <div><span class="badge ${done ? 'done' : 'todo'}">${done ? '已发货' : s ? '已记录，邮件未发出' : '待发货'}</span>${o.relisted ? ' <span class="badge">已重新上架</span>' : ''}</div></div>
    ${refundBox(o)}
    <div class="items">${o.items.map(i => e(i.name) + (i.qty > 1 ? ' ×' + e(i.qty) : '')).join('，')}</div>
    <div class="grid">
      <div><div class="k">寄送地址（点击可选中复制）</div><div style="user-select:all">${addr.map(e).join('<br>')}</div></div>
      <div><div class="k">联系方式</div><div>${e(o.email)}<br>${e(o.phone || '—')}</div>
        <div class="k" style="margin-top:8px">实付</div><div>${gbp(o.totalPence)}${o.discountPence > 0 ? `（优惠码 ${e(o.voucher)} −${gbp(o.discountPence)}）` : ''}</div></div>
    </div>
    ${done && editing !== o.id
      ? `<div class="tracked">${e(s.carrierName)}：<b>${e(s.tracking)}</b> · 发货邮件已发送 · <button type="button" class="link" data-edit="${e(o.id)}">更正单号</button></div>`
      : shipForm(o)}
    ${s && !done ? '<div class="warn">单号已保存，但发货邮件没有发出，请再点一次按钮重发。</div>' : ''}
    <div class="row">
      ${o.stripeUrl ? `<a href="${e(o.stripeUrl)}" target="_blank" rel="noopener">在 Stripe 查看</a>` : ''}
      ${o.orderUrl ? `<a href="${e(o.orderUrl)}" target="_blank" rel="noopener noreferrer">买家看到的页面</a>` : ''}
      <button type="button" class="link" data-relist="${e(o.id)}" data-v="${o.relisted ? '0' : '1'}">${o.relisted ? '撤销重新上架' : '作品重新上架（退货/测试单）'}</button>
    </div>
  </div>`;
}
function tabsBar() {
  const n = orders.filter(o => !isDone(o)).length;
  const b = (id, text) => `<button data-tab="${id}" class="${tab === id ? 'on' : ''}">${text}</button>`;
  return `<div class="tabs">${b('todo', `待发货 (${n})`)}${b('done', `已发货 (${orders.length - n})`)}${b('refund', `退款申请 (${orders.filter(o => o.refund).length})`)}${b('all', `全部 (${orders.length})`)}
    <span class="gap"></span>${b('send', '发送优惠券')}${b('coupons', '优惠券管理')}</div>`;
}
const couponTerms = c => `${c.maxRedemptions ? `可用 ${c.maxRedemptions} 次，已用 ${c.timesRedeemed} 次` : `不限次数，已用 ${c.timesRedeemed} 次`} · ${c.expiresOn ? `${c.expiresOn} 到期` : '不过期'}`;
const couponStatus = c => !c.active ? '已停用' : c.expired ? '已过期' : c.usedUp ? '已用完' : '可用';
function sendView() {
  if (!coupons) return `<div class="empty">${couponErr ? e(couponErr) : '加载中…'}</div>`;
  const ok = coupons.filter(c => c.sendable);
  if (!ok.length) return '<div class="card">没有可发送的优惠券。请先到“优惠券管理”新建或导入一张。</div>';
  return `<form class="card form" id="send-form">
    <h3 class="wide" style="margin:0">发送优惠券</h3>
    <label class="wide">收件人邮箱<input name="email" type="email" required autocomplete="off"></label>
    <label class="wide">优惠券<select name="coupon">${ok.map(c => `<option value="${e(c.id)}">${e(c.code)} · ${e(c.label)} · ${e(couponTerms(c))}${c.sentCount ? ` · 已发 ${c.sentCount} 次` : ''}</option>`).join('')}</select></label>
    <label class="wide">附言（可选，英文，会显示在邮件里）<textarea name="message" rows="3" maxlength="500"></textarea></label>
    <p class="hint wide">请只发给同意接收优惠信息的人，或买过我们作品、也没有要求退订的客户。对方回复要求退订后，不要再发。</p>
    <div class="wide actions"><button>发送</button><span class="ok">${e(sentMsg)}</span><span class="err" style="min-height:0"></span></div>
  </form>`;
}
function couponFields(c) {
  const v = c || { kind: 'amount', value: '', maxRedemptions: 1, expiresOn: '', note: '' };
  return `<label>优惠类型<select name="kind"><option value="amount" ${v.kind === 'amount' ? 'selected' : ''}>减固定金额（£）</option><option value="percent" ${v.kind === 'percent' ? 'selected' : ''}>打折（减 %）</option></select></label>
    <label>数值（如 10 表示减 £10 或减 10%）<input name="value" type="number" min="0.01" step="0.01" required value="${e(v.value)}"></label>
    <label>可用次数（留空为不限）<input name="maxRedemptions" type="number" min="1" step="1" value="${e(v.maxRedemptions == null ? '' : v.maxRedemptions)}"></label>
    <label>到期日期（留空为不过期）<input name="expiresOn" type="date" value="${e(v.expiresOn)}"></label>
    <label class="wide">内部备注（买家看不到）<input name="note" maxlength="200" value="${e(v.note)}"></label>`;
}
function couponForm(c) {
  return `<form class="card form coupon-edit" data-id="${e(c.id)}">
    <h3 class="wide code" style="margin:0">修改 ${e(c.code)}</h3>
    ${c.timesRedeemed ? '<p class="hint wide">这张券已被用过，只能改备注。要改优惠内容，请停用后新建。</p>' : ''}
    ${couponFields(c)}
    <div class="wide actions"><button>保存</button><button type="button" class="ghost" data-cancel-coupon="1">取消</button><span class="err" style="min-height:0"></span></div>
  </form>`;
}
function couponRow(c) {
  const used = c.maxRedemptions ? `${c.timesRedeemed} / ${c.maxRedemptions}` : `${c.timesRedeemed} / 不限`;
  return `<tr class="${editingCoupon === c.id ? 'on' : ''}">
    <td class="code">${e(c.code)}</td>
    <td>${e(c.label)}</td>
    <td><span class="badge ${c.sendable ? 'done' : ''}">${couponStatus(c)}</span></td>
    <td>${e(used)}</td>
    <td>${e(c.expiresOn || '不过期')}</td>
    <td>${c.sentCount ? `已发 ${c.sentCount} 次<div class="hint">${e(c.lastSentTo)}</div>` : '—'}</td>
    <td class="note">${e(c.note || '—')}</td>
    <td class="ops"><button type="button" class="link" data-edit-coupon="${e(c.id)}">修改</button>
      <button type="button" class="link" data-active-coupon="${e(c.id)}" data-v="${c.active ? '0' : '1'}">${c.active ? '停用' : '启用'}</button>
      ${c.active ? '' : `<button type="button" class="link" data-delete-coupon="${e(c.id)}" style="color:var(--orange)">删除</button>`}</td>
  </tr>`;
}
function couponTable() {
  if (!coupons.length) return '<div class="empty">还没有优惠券</div>';
  return `<div class="table-wrap" tabindex="0" aria-label="优惠券列表"><table>
    <thead><tr><th>券码</th><th>优惠</th><th>状态</th><th>已用</th><th>到期</th><th>发送</th><th>备注</th><th>操作</th></tr></thead>
    <tbody>${coupons.map(couponRow).join('')}</tbody>
  </table></div>`;
}
function couponsView() {
  if (!coupons) return `<div class="empty">${couponErr ? e(couponErr) : '加载中…'}</div>`;
  return `<form class="card form" id="coupon-new">
      <h3 class="wide" style="margin:0">新建优惠券</h3>
      <label class="wide">券码（留空自动生成）<input name="code" maxlength="32" autocomplete="off" style="text-transform:uppercase"></label>
      ${couponFields()}
      <div class="wide actions"><button>创建</button><span class="err" style="min-height:0"></span></div>
    </form>
    ${coupons.filter(c => c.id === editingCoupon).map(couponForm).join('')}${couponTable()}
    <form class="card form" id="coupon-import">
      <label class="wide">导入在 Stripe 后台建的券码<input name="code" required autocomplete="off"></label>
      <div class="wide actions"><button class="ghost">导入</button><span class="err" style="min-height:0"></span></div>
    </form>`;
}
async function loadCoupons() {
  couponErr = '';
  try { coupons = (await api('/api/admin/coupons')).coupons; }
  catch (err) { couponErr = err.message; }
  if (tab === 'send' || tab === 'coupons') render();
}
function render() {
  if (tab === 'send' || tab === 'coupons') {
    app.innerHTML = tabsBar() + (tab === 'send' ? sendView() : couponsView());
    return;
  }
  const list = orders.filter(o => tab === 'all' || (tab === 'refund' ? o.refund : tab === 'todo' ? !isDone(o) : isDone(o)));
  app.innerHTML = `${tabsBar()}
    ${list.map(card).join('') || '<div class="empty">没有订单</div>'}`;
}
app.addEventListener('click', async ev => {
  const t = ev.target;
  if (t.dataset.tab) {
    tab = t.dataset.tab; editing = null; editingCoupon = null; sentMsg = ''; render();
    if ((tab === 'send' || tab === 'coupons') && !coupons) loadCoupons();
  }
  if (t.dataset.editCoupon) { editingCoupon = t.dataset.editCoupon; render(); }
  if (t.dataset.cancelCoupon) { editingCoupon = null; render(); }
  if (t.dataset.deleteCoupon) {
    const c = coupons.find(x => x.id === t.dataset.deleteCoupon);
    if (!confirm(`确定删除 ${c.code} 吗？它会从这个列表消失。Stripe 后台仍会保留这条已停用的记录，以后可以用底部的导入找回。`)) return;
    t.disabled = true;
    try {
      await api('/api/admin/coupons/' + encodeURIComponent(c.id) + '/delete', {});
      coupons = coupons.filter(x => x.id !== c.id); render();
    } catch (err) { alert(err.message); t.disabled = false; }
  }
  if (t.dataset.activeCoupon) {
    const on = t.dataset.v === '1';
    if (!on && !confirm('确定停用吗？停用后这个券码马上不能再用。')) return;
    t.disabled = true;
    try {
      const u = await api('/api/admin/coupons/' + encodeURIComponent(t.dataset.activeCoupon) + '/active', { active: on });
      coupons = coupons.map(c => c.id === u.id ? u : c); render();
    } catch (err) { alert(err.message); t.disabled = false; }
  }
  if (t.dataset.edit) { editing = t.dataset.edit; render(); }
  if (t.dataset.relist) {
    const on = t.dataset.v === '1';
    if (!confirm(on ? '确定把这笔订单里的作品重新上架吗？确认后别人就能再次购买。' : '确定撤销吗？作品会重新显示已售。')) return;
    t.disabled = true;
    try {
      const u = await api('/api/admin/orders/' + encodeURIComponent(t.dataset.relist) + '/relist', { relisted: on });
      orders = orders.map(o => o.id === u.id ? u : o); render();
    } catch (err) { alert(err.message); t.disabled = false; }
  }
});
app.addEventListener('submit', async ev => {
  const f = ev.target;
  if (f.id === 'send-form') return submitSend(ev, f);
  if (f.id === 'coupon-new' || f.id === 'coupon-import' || f.classList.contains('coupon-edit')) return submitCoupon(ev, f);
  if (!f.classList.contains('ship')) return;
  ev.preventDefault();
  const b = f.querySelector('button'), msg = f.querySelector('.err');
  const carrier = f.carrier.value, tracking = f.tracking.value.trim();
  const name = carriers.find(c => c.id === carrier).name;
  if (!confirm(`确认发送发货邮件给买家？\n\n${name}：${tracking}`)) return;
  b.disabled = true; msg.textContent = '';
  try {
    const u = await api('/api/admin/orders/' + encodeURIComponent(f.dataset.id) + '/ship', { carrier, tracking });
    orders = orders.map(o => o.id === u.id ? u : o); editing = null; render();
  } catch (err) {
    msg.textContent = err.message; b.disabled = false;
  }
});
async function submitSend(ev, f) {
  ev.preventDefault();
  const b = f.querySelector('button'), msg = f.querySelector('.err');
  const c = coupons.find(x => x.id === f.coupon.value);
  const email = f.email.value.trim();
  const repeat = c.maxRedemptions === 1 && c.sentCount ? `\n\n注意：这张券只能用一次，之前已发给 ${c.lastSentTo}。谁先用谁有效。` : '';
  if (!confirm(`确认发送？\n\n${email}\n${c.code} · ${c.label}${repeat}`)) return;
  b.disabled = true; msg.textContent = '';
  try {
    const u = await api('/api/admin/coupons/' + encodeURIComponent(c.id) + '/send', { email, message: f.message.value });
    coupons = coupons.map(x => x.id === u.id ? u : x);
    sentMsg = `已发送给 ${email}` + (u.sendRecorded ? '' : '（发送记录没有保存）');
    render();
  } catch (err) { msg.textContent = err.message; b.disabled = false; }
}
async function submitCoupon(ev, f) {
  ev.preventDefault();
  const b = f.querySelector('button'), msg = f.querySelector('.err');
  msg.textContent = '';
  let url = '/api/admin/coupons', body;
  if (f.id === 'coupon-import') { url += '/import'; body = { code: f.code.value }; }
  else {
    body = { kind: f.kind.value, value: f.value.value, maxRedemptions: f.maxRedemptions.value, expiresOn: f.expiresOn.value, note: f.note.value };
    if (f.id === 'coupon-new') body.code = f.code.value;
    else {
      url += '/' + encodeURIComponent(f.dataset.id);
      const old = coupons.find(c => c.id === f.dataset.id);
      if (old.sentCount && !confirm(`这张券已经发出 ${old.sentCount} 次。修改后，已发出的邮件里写的还是旧内容。确定修改吗？`)) return;
    }
  }
  b.disabled = true;
  try {
    await api(url, body);
    editingCoupon = null;
    await loadCoupons();
  } catch (err) { msg.textContent = err.message; b.disabled = false; }
}
logoutBtn.onclick = async () => { await api('/api/admin/logout', {}).catch(() => {}); showLogin(); };
load().catch(() => {});
</script>
</body>
</html>
